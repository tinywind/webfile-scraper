name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the release image
        run: docker build --pull --tag webfile-scraper:test .
      - name: Test the packaged application without external network access
        run: >-
          docker run --rm --network none
          --mount type=bind,src="${{ github.workspace }}/test",dst=/usr/src/app/test,readonly
          webfile-scraper:test node --test
